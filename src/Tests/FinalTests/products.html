<!DOCTYPE html>

<html>
<head>
    <title>Products</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        table {
            width: 100%;
            border: 1px solid #cccccc;
        }

        th {
            background: #eeeeee;
            padding: 10px;
        }

        td {
            padding: 10px;
        }

        .btn {
            padding: 8px;
            border: 1px solid #333333;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h1>Products</h1>

<p>
    <a class="btn" href="/products/add">Add Product</a>
</p>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for product in products %}

    <tr>

        <td>{{ product.id }}</td>

        <td>{{ product.name }}</td>

        <td>{{ product.price }}</td>

        <td>
            {% if product.in_stock %}
            In Stock
            {% else %}
            Out Of Stock
            {% endif %}
        </td>

        <td>
            <a href="/products/details?id={{ product.id }}"> View </a>
            <a href="/products/delete?id={{ product.id }}"> Delete </a>
        </td>

    </tr>

    {% endfor %}

</table>

</body>
</html>
