<!DOCTYPE html>

<html>
<head>
    <title>Products</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<nav class="nav">
    <a class="btn" href="/products">Products</a>
    <a class="btn" href="/products/add">Add Product</a>
</nav>

<h1>Products</h1>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for product in products %}

    <tr>

        <td>{{ product.id }}</td>

        <td>{{ product.name }}</td>

        <td>{{ product.price }}</td>

        <td>
            {% if product.in_stock %}
            <span class="status-in">In Stock</span>
            {% else %}
            <span class="status-out">Out Of Stock</span>
            {% endif %}
        </td>

        <td>
            <a class="btn" href="/products/details?id={{ product.id }}">View</a>
            <a class="btn btn-danger" href="/products/delete?id={{ product.id }}">Delete</a>
        </td>

    </tr>

    {% endfor %}

</table>

</body>
</html>
