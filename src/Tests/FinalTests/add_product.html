<!DOCTYPE html>

<html>
<head>
    <title>Add Product</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<nav class="nav">
    <a class="btn" href="/products">Products</a>
    <a class="btn" href="/products/add">Add Product</a>
</nav>

<h1>Add Product</h1>

<form method="POST" action="/products/create">

    <label>Name</label>
    <input type="text" name="name">

    <label>Price</label>
    <input type="text" name="price">

    <button type="submit">
        Save Product
    </button>

</form>

<p>
    <a class="btn" href="/products">Back To Products</a>
</p>

</body>
</html>
