<!DOCTYPE html>

<html>
<head>
    <title>Product Details</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<nav class="nav">
    <a class="btn" href="/products">Products</a>
    <a class="btn" href="/products/add">Add Product</a>
</nav>

<h1>Product Details</h1>

<div class="card">

    <p>
        ID:
        {{ product.id }}
    </p>

    <p>
        Name:
        {{ product.name }}
    </p>

    <p>
        Price:
        {{ product.price }}
    </p>

    <p>
        {% if product.in_stock %}
        <span class="status-in">Available</span>
        {% else %}
        <span class="status-out">Not Available</span>
        {% endif %}
    </p>

</div>

<p>
    <a class="btn" href="/products">Back To Products</a>
    <a class="btn" href="/products/edit?id={{ product.id }}">Edit Product</a>
    <a class="btn btn-danger" href="/products/delete?id={{ product.id }}">Delete Product</a>
</p>

</body>
</html>
