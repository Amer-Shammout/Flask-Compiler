<!DOCTYPE html>

<html>
<head>
    <title>Product Details</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .card {
            border: 1px solid #cccccc;
            padding: 20px;
            width: 400px;
        }
    </style>
</head>

<body>

<h1>Product Details</h1>

<div class="card">

    <p>
        ID:
        {{ product.id }}
    </p>

    <p>
        Name:
        {{ product.name }}
    </p>

    <p>
        Price:
        {{ product.price }}
    </p>

    <p>
        {% if product.in_stock %}
        Available
        {% else %}
        Not Available
        {% endif %}
    </p>

</div>

<p>
    <a href="/products">
        Back To Products
    </a>
</p>

</body>
</html>
