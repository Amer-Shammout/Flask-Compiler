<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>
    <h1>Product List</h1>
    <ul>
        {% for product in products %}
            <li>
                <a href="/products/details?id={{ product[0] }}">
                    {{ product[1] }} - ${{ product[2] }}
                    {% if product[3] %}
                        (In Stock)
                    {% else %}
                        (Out of Stock)
                    {% endif %}
                </a>
            </li>
        {% endfor %}
    </ul>
    <a href="/products/add">Add New Product</a>
</body>
</html>
