<!DOCTYPE html>
<html>
<head>
    <!--try user in flask with function render_template to this page be "user" or 1 or [1,2]... , then show errors  -->
    <title>Add Product</title>
    <h1>{{ user+1 }}</h1>
    <h1>{{ len(user) }}</h1>
    <h1>{{ user() }}</h1>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        form {
            width: 400px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
        }
    </style>
</head>

<body>


<h1>Add Product</h1>

<form method="POST" action="/products/create">

    <label>Name</label>

    <input  type="text" name="name">

    <label>Price</label>

    <input type="text" name="price">

    <button type="submit">
        Save Product
    </button>

</form>

<p>
    <a href="/products">
        Back To Products
    </a>
</p>

<div>
    {% if user<1 %}
    <p>Welcome, Admin!</p>
    {% else %}
    <p>Welcome, User!</p>
    {% endif %}
</div>
</body>
</html>
